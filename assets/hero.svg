<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="img" aria-label="Graphic designer at desk with drawing tablet in a modern studio">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0e18"/>
      <stop offset="45%" stop-color="#12182a"/>
      <stop offset="100%" stop-color="#1a1020"/>
    </linearGradient>
    <linearGradient id="wall" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#151b2c"/>
      <stop offset="100%" stop-color="#0d121c"/>
    </linearGradient>
    <linearGradient id="desk" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#2a2438"/>
      <stop offset="100%" stop-color="#1a1524"/>
    </linearGradient>
    <linearGradient id="hoodie" x1="0%" y1="0%" x2="30%" y2="100%">
      <stop offset="0%" stop-color="#1e3a5f"/>
      <stop offset="55%" stop-color="#0f2744"/>
      <stop offset="100%" stop-color="#0a1c33"/>
    </linearGradient>
    <linearGradient id="skin" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#d4a574"/>
      <stop offset="50%" stop-color="#c48a5a"/>
      <stop offset="100%" stop-color="#a86b42"/>
    </linearGradient>
    <linearGradient id="screen1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2a3550"/>
      <stop offset="100%" stop-color="#1a2238"/>
    </linearGradient>
    <linearGradient id="screen2" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#243048"/>
      <stop offset="100%" stop-color="#161e30"/>
    </linearGradient>
    <linearGradient id="lamp" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fff5e0"/>
      <stop offset="100%" stop-color="#ffc878" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="keylight" cx="42%" cy="35%" r="45%">
      <stop offset="0%" stop-color="#ffd9a8" stop-opacity="0.35"/>
      <stop offset="55%" stop-color="#dc2626" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#000" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="rim" cx="70%" cy="30%" r="40%">
      <stop offset="0%" stop-color="#4a7ab0" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#000" stop-opacity="0"/>
    </radialGradient>
    <filter id="softBlur" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8"/>
    </filter>
    <filter id="glow">
      <feGaussianBlur stdDeviation="12" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <clipPath id="frame">
      <rect width="1600" height="900" rx="0"/>
    </clipPath>
  </defs>

  <g clip-path="url(#frame)">
    <!-- Studio background -->
    <rect width="1600" height="900" fill="url(#bg)"/>
    <rect x="0" y="0" width="1600" height="620" fill="url(#wall)"/>
    <!-- Floor -->
    <rect x="0" y="620" width="1600" height="280" fill="#0c1018"/>
    <ellipse cx="800" cy="780" rx="520" ry="40" fill="#000" opacity="0.45"/>

    <!-- Soft cinematic lights -->
    <ellipse cx="620" cy="280" rx="380" ry="260" fill="url(#keylight)"/>
    <ellipse cx="1100" cy="220" rx="300" ry="220" fill="url(#rim)"/>

    <!-- Dual monitors (softly blurred feel via lower opacity + soft shapes) -->
    <g opacity="0.85" filter="url(#softBlur)" transform="translate(40,0)">
      <!-- Left monitor -->
      <rect x="980" y="210" width="280" height="180" rx="8" fill="#1a1f2e" stroke="#2a3348" stroke-width="6"/>
      <rect x="990" y="220" width="260" height="150" rx="3" fill="url(#screen1)"/>
      <rect x="1090" y="390" width="60" height="50" fill="#1a1f2e"/>
      <rect x="1050" y="435" width="140" height="10" rx="3" fill="#252b3a"/>
      <!-- Abstract logo on left screen -->
      <circle cx="1120" cy="295" r="36" fill="none" stroke="#dc2626" stroke-width="4" opacity="0.7"/>
      <path d="M1100 310 L1120 265 L1140 310 Z" fill="#e8ecf4" opacity="0.5"/>
      <rect x="1010" y="250" width="70" height="8" rx="2" fill="#4a5568" opacity="0.6"/>
      <rect x="1010" y="268" width="55" height="6" rx="2" fill="#3a4558" opacity="0.5"/>
      <rect x="1010" y="340" width="90" height="6" rx="2" fill="#3a4558" opacity="0.4"/>
    </g>
    <g opacity="0.75" filter="url(#softBlur)">
      <!-- Right monitor -->
      <rect x="1240" y="240" width="240" height="160" rx="8" fill="#1a1f2e" stroke="#2a3348" stroke-width="5"/>
      <rect x="1248" y="248" width="224" height="134" rx="3" fill="url(#screen2)"/>
      <rect x="1335" y="400" width="50" height="40" fill="#1a1f2e"/>
      <rect x="1300" y="435" width="120" height="8" rx="3" fill="#252b3a"/>
      <!-- Color palette / UI mock -->
      <rect x="1270" y="270" width="80" height="50" rx="4" fill="#dc2626" opacity="0.45"/>
      <rect x="1360" y="270" width="80" height="50" rx="4" fill="#3b82f6" opacity="0.35"/>
      <rect x="1270" y="330" width="170" height="8" rx="2" fill="#4a5568" opacity="0.5"/>
      <rect x="1270" y="348" width="120" height="6" rx="2" fill="#3a4558" opacity="0.4"/>
    </g>

    <!-- Desk -->
    <path d="M180 560 L1420 560 L1480 720 L120 720 Z" fill="url(#desk)"/>
    <path d="M180 560 L1420 560 L1400 575 L200 575 Z" fill="#3a3250" opacity="0.5"/>
    <rect x="200" y="720" width="40" height="90" fill="#15101c"/>
    <rect x="1360" y="720" width="40" height="90" fill="#15101c"/>

    <!-- Desk lamp -->
    <g transform="translate(1180,380)">
      <rect x="70" y="170" width="50" height="14" rx="4" fill="#2a2438"/>
      <rect x="88" y="40" width="12" height="135" rx="3" fill="#3a3550"/>
      <path d="M50 50 Q94 10 138 50" fill="none" stroke="#4a4560" stroke-width="8" stroke-linecap="round"/>
      <ellipse cx="50" cy="55" rx="28" ry="14" fill="#2a2438"/>
      <ellipse cx="50" cy="58" rx="22" ry="10" fill="#ffd9a0" opacity="0.9" filter="url(#glow)"/>
      <ellipse cx="20" cy="180" rx="90" ry="50" fill="url(#lamp)" opacity="0.55"/>
    </g>

    <!-- Chair back -->
    <ellipse cx="620" cy="520" rx="90" ry="110" fill="#1a2030"/>
    <ellipse cx="620" cy="520" rx="70" ry="90" fill="#222a3c"/>

    <!-- Person: seated graphic designer -->
    <g transform="translate(520,280)">
      <!-- Torso / hoodie -->
      <path d="M40 200
               C20 210 10 280 15 360
               L185 360
               C190 280 180 210 160 200
               C145 185 130 175 100 170
               C70 175 55 185 40 200 Z" fill="url(#hoodie)"/>
      <!-- Hoodie pocket -->
      <path d="M55 290 L145 290 L140 340 L60 340 Z" fill="#0c1a2e" opacity="0.45"/>
      <!-- Hood -->
      <path d="M55 175 C60 145 80 125 100 122 C120 125 140 145 145 175
               C130 165 110 160 100 160 C90 160 70 165 55 175 Z" fill="#0f2744"/>
      <!-- Neck -->
      <rect x="85" y="165" width="30" height="28" rx="8" fill="url(#skin)"/>
      <!-- Head -->
      <ellipse cx="100" cy="110" rx="48" ry="55" fill="url(#skin)"/>
      <!-- Hair (short dark) -->
      <path d="M52 105
               C55 60 75 45 100 42
               C125 45 145 60 148 105
               C140 85 125 75 100 72
               C75 75 60 85 52 105 Z" fill="#1a1210"/>
      <path d="M52 100 C48 115 52 130 58 135 C55 115 55 105 52 100 Z" fill="#1a1210"/>
      <path d="M148 100 C152 115 148 130 142 135 C145 115 145 105 148 100 Z" fill="#1a1210"/>
      <!-- Ears -->
      <ellipse cx="52" cy="115" rx="8" ry="12" fill="#b87848"/>
      <ellipse cx="148" cy="115" rx="8" ry="12" fill="#b87848"/>
      <!-- Face features (subtle) -->
      <ellipse cx="82" cy="115" rx="5" ry="4" fill="#3a2a20" opacity="0.55"/>
      <ellipse cx="118" cy="115" rx="5" ry="4" fill="#3a2a20" opacity="0.55"/>
      <path d="M92 138 Q100 145 108 138" fill="none" stroke="#8a5a3a" stroke-width="2.5" stroke-linecap="round" opacity="0.7"/>
      <!-- Soft cheek warmth -->
      <ellipse cx="70" cy="128" rx="10" ry="6" fill="#c45a4a" opacity="0.2"/>
      <ellipse cx="130" cy="128" rx="10" ry="6" fill="#c45a4a" opacity="0.2"/>

      <!-- Left arm (hoodie sleeve) resting near tablet -->
      <path d="M15 230
               C-20 260 -40 300 -30 340
               C-10 355 20 350 40 340
               C35 300 30 260 40 230 Z" fill="#0f2744"/>
      <!-- Left hand -->
      <ellipse cx="-20" cy="350" rx="22" ry="14" fill="url(#skin)" transform="rotate(-15 -20 350)"/>

      <!-- Right arm holding stylus -->
      <path d="M160 230
               C200 250 240 290 270 330
               C255 345 230 350 210 340
               C190 300 175 260 160 230 Z" fill="#0f2744"/>
      <!-- Right hand -->
      <ellipse cx="265" cy="345" rx="18" ry="12" fill="url(#skin)" transform="rotate(25 265 345)"/>
    </g>

    <!-- Drawing tablet on desk -->
    <g transform="translate(580,545)">
      <rect x="0" y="0" width="280" height="185" rx="14" fill="#1c222e" stroke="#2e3648" stroke-width="3"/>
      <rect x="14" y="14" width="252" height="145" rx="6" fill="#0e121a"/>
      <!-- Logo work-in-progress on tablet -->
      <circle cx="140" cy="80" r="42" fill="none" stroke="#dc2626" stroke-width="5" opacity="0.85"/>
      <path d="M118 95 L140 50 L162 95 Z" fill="#e8ecf4" opacity="0.55"/>
      <rect x="100" y="115" width="80" height="6" rx="2" fill="#4a5568" opacity="0.5"/>
      <circle cx="250" cy="170" r="4" fill="#3b82f6" opacity="0.7"/>
    </g>

    <!-- Digital stylus -->
    <g transform="translate(820,500) rotate(35)">
      <rect x="0" y="0" width="10" height="95" rx="4" fill="#c8d0e0"/>
      <rect x="1" y="0" width="8" height="18" rx="3" fill="#2a3140"/>
      <polygon points="5,-12 0,0 10,0" fill="#8a93a8"/>
      <rect x="2" y="70" width="6" height="12" rx="2" fill="#dc2626" opacity="0.8"/>
    </g>

    <!-- Subtle red accent bar (brand tie-in) -->
    <rect x="0" y="0" width="8" height="900" fill="#dc2626" opacity="0.7"/>

    <!-- Vignette -->
    <rect width="1600" height="900" fill="url(#keylight)" opacity="0.15"/>
    <radialGradient id="vig" cx="50%" cy="45%" r="70%">
      <stop offset="55%" stop-color="#000" stop-opacity="0"/>
      <stop offset="100%" stop-color="#000" stop-opacity="0.55"/>
    </radialGradient>
    <rect width="1600" height="900" fill="url(#vig)"/>
  </g>
</svg>
